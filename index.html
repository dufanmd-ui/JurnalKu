<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aplikasiku</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aplikasiku">
<script>try{var tt=localStorage.getItem('jk-tema');if(tt)document.documentElement.setAttribute('data-theme',tt)}catch(e){}</script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e3e6eb;--ac:#2f6fed;--hijau:#23704f;--oranye:#c2410c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1e24;--tx:#e8eaed;--mut:#9aa3af;--bd:#2a3038;--ac:#6b9bff;--hijau:#5cc597;--oranye:#e8672c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1e24;--tx:#e8eaed;--mut:#9aa3af;--bd:#2a3038;--ac:#6b9bff;--hijau:#5cc597;--oranye:#e8672c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:1.7rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 22px}
.app{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;color:inherit;text-decoration:none}
.app:hover,.app:focus-visible{border-color:var(--ac);outline:none}
.app:active{transform:scale(.99)}
.app b{display:block;font-size:1.15rem}
.app span{color:var(--mut);font-size:.92rem}
.ico{width:64px;height:64px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ico img{width:64px;height:64px;display:block}
.ico.sehat{background:var(--hijau);color:#fff}
.ico.resto{background:var(--oranye);color:#fff}
.arrow{margin-left:auto;color:var(--mut);flex:none}
</style>
</head>
<body>
<main>
  <h1>Aplikasiku</h1>
  <p class="sub">Pilih aplikasi yang ingin dibuka.</p>

  <a class="app" href="index-jurnal.html">
    <div class="ico"><img src="icon-192.png" alt="" width="64" height="64"></div>
    <div><b>JurnalKu</b><span>Jurnal dan laporan keuangan</span></div>
    <svg class="arrow" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
  </a>

  <a class="app" href="index-sehat.html">
    <div class="ico sehat"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8Z"/></svg></div>
    <div><b>Hidup Sehat</b><span>Jadwal makan, olahraga, tidur, dan catatan harian</span></div>
    <svg class="arrow" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
  </a>

  <a class="app" href="index-restoran.html">
    <div class="ico resto"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8"/><path d="M4 3v5a3 3 0 0 0 6 0V3"/><path d="M7 11v10"/><path d="M17 3c-2.2 1.4-3 3.6-3 6.5 0 2 1 3 3 3.5V21"/></svg></div>
    <div><b>Menu &amp; Order Restoran</b><span>Menu, pesanan pelanggan, cetak dapur dan bill</span></div>
    <svg class="arrow" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
  </a>
</main>
<script>
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
